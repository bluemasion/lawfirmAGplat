version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: lawfirm-api
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./prod-data/materials:/app/data/materials
      - ./prod-data/bidding:/app/data/bidding
      - ./prod-data/tasks:/app/data/tasks
      - ./prod-data/company:/app/data/company
      - ./prod-data/uploads:/app/uploads
      - ./agentic_on_arch/templates:/app/templates:ro
    env_file:
      - ./agentic_on_arch/.env
    environment:
      - APP_ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: lawfirm-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  prod-data:
